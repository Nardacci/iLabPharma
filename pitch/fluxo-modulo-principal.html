<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>iLabPharma · Fluxo do Módulo Principal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    body{display:flex;align-items:center;justify-content:center;touch-action:none}
    #viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab;touch-action:none}
    #viewport.dragging{cursor:grabbing}
    img{display:block;width:100vw;height:100vh;object-fit:contain;transform:translate3d(0,0,0) scale(1);transform-origin:center center;user-select:none;-webkit-user-drag:none;will-change:transform}
  </style>
</head>
<body>
  <div id="viewport">
    <img id="flowImage" src="imagens/Fluxo%20-%20M%C3%B3dulo%20Principal.png?v=1.0.0" alt="Fluxo do Módulo Principal do iLabPharma" draggable="false">
  </div>
  <script>
    (()=>{
      const viewport=document.getElementById('viewport');
      const img=document.getElementById('flowImage');
      let scale=1,x=0,y=0,dragging=false,startX=0,startY=0,startPanX=0,startPanY=0;
      const MIN=1,MAX=5,STEP=.25;
      const pointers=new Map(); let pinchStart=0,pinchScale=1;
      function clamp(v){return Math.max(MIN,Math.min(MAX,v))}
      function render(){img.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`}
      function reset(){scale=1;x=0;y=0;render()}
      function zoomAt(next,cx=innerWidth/2,cy=innerHeight/2){
        next=clamp(next); if(next===scale)return;
        const ratio=next/scale;
        x=cx-(cx-x)*ratio; y=cy-(cy-y)*ratio; scale=next;
        if(scale===1){x=0;y=0} render();
      }
      viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale+(e.deltaY<0?STEP:-STEP),e.clientX,e.clientY)},{passive:false});
      viewport.addEventListener('dblclick',e=>{e.preventDefault();scale===1?zoomAt(2.5,e.clientX,e.clientY):reset()});
      viewport.addEventListener('pointerdown',e=>{
        pointers.set(e.pointerId,e); viewport.setPointerCapture(e.pointerId);
        if(pointers.size===1&&scale>1){dragging=true;startX=e.clientX;startY=e.clientY;startPanX=x;startPanY=y;viewport.classList.add('dragging')}
        if(pointers.size===2){dragging=false;const p=[...pointers.values()];pinchStart=Math.hypot(p[0].clientX-p[1].clientX,p[0].clientY-p[1].clientY);pinchScale=scale}
      });
      viewport.addEventListener('pointermove',e=>{
        pointers.set(e.pointerId,e);
        if(pointers.size===1&&dragging){x=startPanX+e.clientX-startX;y=startPanY+e.clientY-startY;render()}
        if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].clientX-p[1].clientX,p[0].clientY-p[1].clientY);if(pinchStart)zoomAt(pinchScale*(d/pinchStart),(p[0].clientX+p[1].clientX)/2,(p[0].clientY+p[1].clientY)/2)}
      });
      function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=0;if(pointers.size===0){dragging=false;viewport.classList.remove('dragging')}}
      viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);viewport.addEventListener('pointerleave',()=>{});
      window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoomAt(scale+STEP);else if(e.key==='-'||e.key==='_')zoomAt(scale-STEP);else if(e.key==='0'||e.key==='Escape')reset()});
      render();
    })();
  </script>
</body>
</html>
