<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iLabPharma · Fluxo do Módulo Principal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#06131d;color:#fff}
    body{display:flex;flex-direction:column}
    .header{height:68px;flex:0 0 68px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(120,150,165,.18);background:#06131d}
    .brand{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
    .brand img{width:176px;height:auto;display:block}
    .divider{width:1px;height:34px;margin:0 18px;border-left:1px solid rgba(120,150,165,.28)}
    .title{display:flex;flex-direction:column;gap:3px}
    .title strong{font-size:18px;line-height:1;font-weight:800}
    .title span{font-size:9px;color:#8ea4b0}
    .home{margin-left:auto;width:40px;height:40px;border:1px solid rgba(150,170,181,.35);border-radius:50%;background:#061a32;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:18px}
    .content{position:relative;flex:1;min-height:0;padding:10px 24px 18px;display:flex;align-items:center;justify-content:center}
    .close{position:absolute;top:14px;right:34px;z-index:20;width:38px;height:38px;border:1px solid rgba(150,170,181,.45);border-radius:50%;background:#061a32;color:#fff;font-size:25px;line-height:1;display:grid;place-items:center;text-decoration:none}
    .viewer{position:relative;width:100%;height:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.18);cursor:grab}
    .viewer.dragging{cursor:grabbing}
    .canvas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .flow{display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform;user-select:none}
    .flow img{display:block;width:auto;height:auto;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none}
    .toolbar{position:absolute;right:88px;top:14px;z-index:21;display:flex;align-items:center;gap:4px;padding:5px;border:1px solid rgba(150,170,181,.35);border-radius:22px;background:rgba(6,26,50,.96);box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .toolbar button{width:32px;height:30px;border:0;border-radius:16px;background:transparent;color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center}
    .toolbar button:hover{background:rgba(255,255,255,.1)}
    .zoom-level{min-width:52px;text-align:center;color:#dce7ed;font-size:10px;font-weight:700}
    .bottom{position:absolute;left:24px;bottom:22px;z-index:21}
    .back{display:inline-flex;align-items:center;padding:10px 15px;border:1px solid rgba(150,170,181,.35);border-radius:22px;background:#06131d;color:#fff;text-decoration:none;font-size:11px}
    .hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:21;padding:7px 12px;border-radius:16px;background:rgba(6,26,50,.9);color:#dce7ed;font-size:9px;pointer-events:none;opacity:.9}
    @media(max-width:700px){
      .header{height:60px;flex-basis:60px;padding:0 16px}.brand img{width:125px}.divider{margin:0 10px}.title strong{font-size:14px}.title span{font-size:8px}.home{width:34px;height:34px}.content{padding:8px 10px 12px}.close{top:12px;right:18px;width:34px;height:34px}.toolbar{right:62px;top:12px}.bottom{left:14px;bottom:16px}.back{font-size:10px}.hint{display:none}
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="Voltar para a apresentação">
      <img src="assets/ilabpharma-logo.svg" alt="iLabPharma">
    </a>
    <div class="divider"></div>
    <div class="title">
      <strong>Módulo Principal</strong>
      <span>Fluxo do Módulo Principal</span>
    </div>
    <a class="home" href="index.html" aria-label="Voltar para a apresentação" title="Voltar para a apresentação">⌂</a>
  </header>

  <main class="content">
    <div class="viewer" id="viewer" aria-label="Visualizador do fluxo">
      <div class="canvas" id="canvas">
        <div class="flow" id="flow">
          <img id="flowImage" src="assets/fluxo-modulo-principal.svg?v=3.0.0" alt="Fluxo do Módulo Principal do iLabPharma">
        </div>
      </div>
    </div>

    <div class="toolbar" aria-label="Controles de zoom">
      <button type="button" id="zoomOut" title="Diminuir zoom" aria-label="Diminuir zoom">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button type="button" id="zoomIn" title="Aumentar zoom" aria-label="Aumentar zoom">+</button>
      <button type="button" id="zoomReset" title="Voltar para 100%" aria-label="Voltar para 100%">↺</button>
    </div>

    <a class="close" href="index.html" aria-label="Fechar e voltar para a apresentação" title="Fechar">×</a>

    <div class="bottom">
      <a class="back" href="index.html">← Voltar para apresentação</a>
    </div>

    <div class="hint">Use + / − ou a roda do mouse para ampliar · arraste para navegar</div>
  </main>

  <script>
    (function(){
      const viewer=document.getElementById('viewer');
      const flow=document.getElementById('flow');
      const image=document.getElementById('flowImage');
      const level=document.getElementById('zoomLevel');
      const minZoom=.5,maxZoom=3,step=.25;
      let zoom=1,x=0,y=0;
      let dragging=false,startX=0,startY=0,startPX=0,startPY=0;

      function render(){
        flow.style.transform=`translate(${x}px,${y}px) scale(${zoom})`;
        level.textContent=Math.round(zoom*100)+'%';
      }

      function setZoom(next,cx=null,cy=null){
        const old=zoom;
        zoom=Math.max(minZoom,Math.min(maxZoom,next));
        if(cx!==null&&cy!==null&&zoom!==old){
          const rect=viewer.getBoundingClientRect();
          const px=cx-rect.left-rect.width/2;
          const py=cy-rect.top-rect.height/2;
          const ratio=zoom/old;
          x=px-(px-x)*ratio;
          y=py-(py-y)*ratio;
        }
        render();
      }

      function reset(){zoom=1;x=0;y=0;render();}

      document.getElementById('zoomIn').addEventListener('click',()=>setZoom(zoom+step));
      document.getElementById('zoomOut').addEventListener('click',()=>setZoom(zoom-step));
      document.getElementById('zoomReset').addEventListener('click',reset);

      viewer.addEventListener('wheel',e=>{
        e.preventDefault();
        setZoom(zoom+(e.deltaY<0?step:-step),e.clientX,e.clientY);
      },{passive:false});

      viewer.addEventListener('pointerdown',e=>{
        if(e.button!==0)return;
        dragging=true;viewer.classList.add('dragging');
        startX=e.clientX;startY=e.clientY;startPX=x;startPY=y;
        viewer.setPointerCapture(e.pointerId);
      });
      viewer.addEventListener('pointermove',e=>{
        if(!dragging)return;
        x=startPX+(e.clientX-startX);y=startPY+(e.clientY-startY);render();
      });
      function endDrag(e){
        if(!dragging)return;
        dragging=false;viewer.classList.remove('dragging');
        try{viewer.releasePointerCapture(e.pointerId)}catch(_){ }
      }
      viewer.addEventListener('pointerup',endDrag);
      viewer.addEventListener('pointercancel',endDrag);
      viewer.addEventListener('dblclick',reset);

      image.addEventListener('load',()=>{reset();});
      render();
    })();
  </script>
</body>
</html>
