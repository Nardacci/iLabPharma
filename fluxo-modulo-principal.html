<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iLabPharma · Fluxo do Módulo Principal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#06131d;color:#fff}
    body{display:flex;flex-direction:column}
    .header{height:68px;flex:0 0 68px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(120,150,165,.18);background:#06131d}
    .brand{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
    .brand img{width:176px;height:auto;display:block}
    .divider{width:1px;height:34px;margin:0 18px;border-left:1px solid rgba(120,150,165,.28)}
    .title{display:flex;flex-direction:column;gap:3px}
    .title strong{font-size:18px;line-height:1;font-weight:800}
    .title span{font-size:9px;color:#8ea4b0}
    .home{margin-left:auto;width:40px;height:40px;border:1px solid rgba(150,170,181,.35);border-radius:50%;background:#061a32;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:18px}
    .content{position:relative;flex:1;min-height:0;padding:10px 24px 18px;display:flex;align-items:center;justify-content:center}
    .close{position:absolute;top:14px;right:34px;z-index:5;width:38px;height:38px;border:1px solid rgba(150,170,181,.45);border-radius:50%;background:#061a32;color:#fff;font-size:25px;line-height:1;display:grid;place-items:center;text-decoration:none}
    .flow{width:100%;height:100%;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:auto;box-shadow:0 12px 35px rgba(0,0,0,.18)}
    .flow img{display:block;width:100%;height:100%;object-fit:contain}
    .bottom{position:absolute;left:24px;bottom:22px;z-index:5}
    .back{display:inline-flex;align-items:center;padding:10px 15px;border:1px solid rgba(150,170,181,.35);border-radius:22px;background:#06131d;color:#fff;text-decoration:none;font-size:11px}
    @media(max-width:700px){
      .header{height:60px;flex-basis:60px;padding:0 16px}.brand img{width:125px}.divider{margin:0 10px}.title strong{font-size:14px}.title span{font-size:8px}.home{width:34px;height:34px}.content{padding:8px 10px 12px}.close{top:12px;right:18px;width:34px;height:34px}.bottom{left:14px;bottom:16px}.back{font-size:10px}
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="Voltar para a apresentação">
      <img src="assets/ilabpharma-logo.svg" alt="iLabPharma">
    </a>
    <div class="divider"></div>
    <div class="title">
      <strong>Módulo Principal</strong>
      <span>Fluxo do Módulo Principal</span>
    </div>
    <a class="home" href="index.html" aria-label="Voltar para a apresentação" title="Voltar para a apresentação">⌂</a>
  </header>

  <main class="content">
    <a class="close" href="index.html" aria-label="Fechar e voltar para a apresentação" title="Fechar">×</a>
    <div class="flow">
      <img src="assets/fluxo-modulo-principal.svg?v=1.0.0" alt="Fluxo do Módulo Principal do iLabPharma">
    </div>
    <div class="bottom">
      <a class="back" href="index.html">← Voltar para apresentação</a>
    </div>
  </main>
</body>
</html>
