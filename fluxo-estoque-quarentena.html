  (()=>{const v=document.getElementById('viewport'),i=document.getElementById('flowImage');let s=1,x=0,y=0,d=false,sx=0,sy=0,px=0,py=0;const MIN=1,MAX=5,STEP=.25;const pts=new Map();let ps=0,ss=1;function c(a){return Math.max(MIN,Math.min(MAX,a))}function r(){i.style.transform=`translate3d(${x}px,${y}px,0) scale(${s})`}function reset(){s=1;x=0;y=0;r()}function z(n,cx=innerWidth/2,cy=innerHeight/2){n=c(n);if(n===s)return;const q=n/s;x=cx-(cx-x)*q;y=cy-(cy-y)*q;s=n;if(s===1){x=0;y=0}r()}v.addEventListener('wheel',e=>{e.preventDefault();z(s+(e.deltaY<0?STEP:-STEP),e.clientX,e.clientY)},{passive:false});v.addEventListener('dblclick',e=>{e.preventDefault();s===1?z(2.5,e.clientX,e.clientY):reset()});v.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);v.setPointerCapture(e.pointerId);if(pts.size===1&&s>1){d=true;sx=e.clientX;sy=e.clientY;px=x;py=y;v.classList.add('dragging')}if(pts.size===2){d=false;const a=[...pts.values()];ps=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);ss=s}});v.addEventListener('pointermove',e=>{pts.set(e.pointerId,e);if(pts.size===1&&d){x=px+e.clientX-sx;y=py+e.clientY-sy;r()}if(pts.size===2){const a=[...pts.values()],dd=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);if(ps)z(ss*(dd/ps),(a[0].clientX+a[1].clientX)/2,(a[0].clientY+a[1].clientY)/2)}});function end(e){pts.delete(e.pointerId);if(pts.size<2)ps=0;if(!pts.size){d=false;v.classList.remove('dragging')}}v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')z(s+STEP);else if(e.key==='-'||e.key==='_')z(s-STEP);else if(e.key==='0'||e.key==='Escape')reset()});r()})();
