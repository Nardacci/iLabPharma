<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iLabPharma — experiência visual para apresentação de processos farmacêuticos.">
  <title>iLabPharma | Process Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2.0.0">
  <link rel="stylesheet" href="home.css?v=2.0.0">
  <link rel="stylesheet" href="journey.css?v=2.0.0">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="assets/ilabpharma-logo.svg" alt="iLabPharma"><span>Inteligência em Processos<br>Farmacêuticos</span></div>
      <nav class="main-nav">
        <button class="nav-item" data-view="home">⌂ <span>Início</span></button>
        <button class="nav-item" data-view="map">◇ <span>Mapa de Processos</span></button>
        <button class="nav-item active" data-view="processes">▣ <span>Processos</span></button>
        <button class="nav-item" data-view="modules">▱ <span>Módulos</span></button>
        <button class="nav-item" data-view="glossary">▢ <span>Glossário</span></button>
        <button class="nav-item" data-view="about">ⓘ <span>Sobre o Projeto</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-label">MÓDULOS</div>
      <div class="module-nav">
        <button class="module-item" data-module="principal"><i>♧</i><span>Principal</span></button>
        <button class="module-item" data-module="estoque"><i>▣</i><span>Estoque</span></button>
        <button class="module-item" data-module="cq"><i>♙</i><span>Controle da Qualidade</span></button>
        <button class="module-item" data-module="gq"><i>◈</i><span>Garantia da Qualidade</span></button>
        <button class="module-item" data-module="documentos"><i>▤</i><span>Controle de Documentos</span></button>
      </div>
      <div class="sidebar-callout"><div class="bulb">♧</div><strong>Entenda o processo.<br>Conecte as etapas.<br>Enxergue o todo.</strong><p>Essa é a inteligência<br>que transforma qualidade<br>em resultado.</p></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumbs"><span>Processos</span><b>›</b><span id="crumb-module">Estoque</span><b>›</b><strong id="crumb-process">Recebimento de materiais</strong></div>
        <div class="top-actions"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar processo, etapa..." aria-label="Buscar processo, etapa"><kbd>⌘ K</kbd></label><button class="icon-btn" title="Alternar tema" id="themeBtn">☼</button><button class="icon-btn" title="Notificações">♧</button><div class="avatar">AN</div></div>
      </header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Fechar">×</button><div id="modalBody"></div></article></div>
  <script src="app.js?v=2.0.0"></script><script src="home.js?v=2.0.0"></script><script src="journey.js?v=2.0.0"></script><script>document.body.classList.remove('home-mode');renderProcess('recebimento');</script>

</html>
