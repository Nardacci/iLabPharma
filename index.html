  <style>
    .topbar-brand{display:flex;align-items:center;flex:0 0 250px;min-width:250px}.topbar-brand img{display:block;width:225px;height:auto;max-height:48px;object-fit:contain;object-position:left center}.topbar-brand span{margin-left:13px;padding-left:13px;border-left:1px solid #31506a;color:#dbe6ed;font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}.topbar{gap:20px}.breadcrumbs{flex:1;min-width:0}.top-actions{margin-left:auto;flex:0 0 auto}.home-nav-btn{height:34px;padding:0 12px;border:1px solid #31506a;background:transparent;color:#dbe6ed;border-radius:8px;font:700 10px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.home-nav-btn:hover{background:rgba(255,255,255,.06);border-color:#55758a}.home-mode .home-nav-btn{display:none}.journey-mode{background:#03111d}.journey-mode .main-content{background:#03111d}.journey-mode .topbar{background:rgba(3,17,29,.94);border-bottom:1px solid rgba(91,143,177,.28)}.journey-mode .topbar-brand img{filter:none}.journey-mode .topbar-brand span{color:#dbe6ed}.journey-mode .breadcrumbs{color:#8194a2}.journey-mode .breadcrumbs strong{color:#e7eef2}.journey-mode .breadcrumbs b{color:#4e6675}.journey-mode .content{padding-top:24px}.journey-mode .top-actions .icon-btn{color:#eef5f9}.journey-mode .top-actions .icon-btn:hover{background:rgba(255,255,255,.06)}.journey-mode .avatar{background:transparent;border:1px solid #31506a}.journey-mode .search-box{background:#0f202d;border-color:#31506a;color:#9aadb9}.journey-mode .search-box input{background:transparent;color:#fff}.journey-mode .home-nav-btn{display:inline-flex}@media(max-width:900px){.topbar-brand{flex-basis:210px;min-width:210px}.topbar-brand img{width:195px}.topbar-brand span{display:none}.topbar{gap:12px}}@media(max-width:760px){.topbar{height:60px;padding:0 14px}.topbar-brand{flex:0 0 auto;min-width:auto}.topbar-brand img{width:170px;max-height:36px}.topbar-brand span,.breadcrumbs{display:none}.top-actions{margin-left:auto}.search-box{width:150px}.home-nav-btn{font-size:9px;padding:0 9px}.journey-mode .search-box{display:none}}
  </style>

    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Fechar">×</button><div id="modalBody"></div></article></div>
  <script src="app.js?v=1.4.0"></script><script src="home.js?v=1.4.0"></script><script src="journey.js?v=1.5.0"></script>
