<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iLabPharma — experiência visual para apresentação de processos farmacêuticos.">
  <title>iLabPharma | Process Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">i</div>
        <div><strong>iLab<span>Pharma</span></strong><small>Inteligência em Processos<br>Farmacêuticos</small></div>
      </div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="home"><span>⌂</span> Início</button>
        <button class="nav-item" data-view="map"><span>⌁</span> Mapa de Processos</button>
        <button class="nav-item" data-view="processes"><span>▣</span> Processos</button>
        <button class="nav-item" data-view="modules"><span>▱</span> Módulos</button>
        <button class="nav-item" data-view="glossary"><span>◇</span> Glossário</button>
      </nav>
      <div class="side-section">
        <div class="side-label">MÓDULOS</div>
        <button class="module-item" data-module="principal"><span class="module-icon principal">⌂</span> Principal</button>
        <button class="module-item" data-module="estoque"><span class="module-icon estoque">▦</span> Estoque</button>
        <button class="module-item" data-module="cq"><span class="module-icon cq">✧</span> Controle da Qualidade</button>
        <button class="module-item" data-module="gq"><span class="module-icon gq">◇</span> Garantia da Qualidade</button>
        <button class="module-item" data-module="docs"><span class="module-icon docs">▤</span> Controle de Documentos</button>
      </div>
      <div class="sidebar-note"><div class="bulb">✦</div><strong>Entenda o processo.<br>Conecte as etapas.<br>Enxergue o todo.</strong><p>Essa é a inteligência que transforma processos em resultado.</p></div>
      <div class="sidebar-footer">iLabPharma Process Experience<br><span>v0.2.0 • Presentation Home</span></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumbs"><span>iLabPharma</span><b>›</b><span id="crumb-module">iLabPharma</span><b>›</b><strong id="crumb-process">Visão geral</strong></div>
        <div class="top-actions">
          <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar processo, etapa..." aria-label="Buscar processo, etapa"></label>
          <button class="icon-btn" title="Alternar tema" id="themeBtn">☼</button>
          <button class="icon-btn" title="Notificações">♧</button>
          <div class="avatar">AN</div>
        </div>
      </header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Fechar">×</button><div id="modalBody"></div></article></div>
  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
