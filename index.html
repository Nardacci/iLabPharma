<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iLabPharma — experiência visual para apresentação de processos farmacêuticos.">
  <title>iLabPharma | Process Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=0.9.0">
  <link rel="stylesheet" href="home.css?v=0.9.0">
  <link rel="stylesheet" href="journey.css?v=0.9.0">
  <style>
    .topbar-brand{display:flex;align-items:center;flex:0 0 250px;min-width:250px}.topbar-brand img{display:block;width:225px;height:auto;max-height:48px;object-fit:contain;object-position:left center}.topbar-brand span{margin-left:13px;padding-left:13px;border-left:1px solid #e4e7ec;color:#8a94a0;font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}.topbar{gap:20px}.breadcrumbs{flex:1;min-width:0}.top-actions{margin-left:auto;flex:0 0 auto}@media(max-width:900px){.topbar-brand{flex-basis:210px;min-width:210px}.topbar-brand img{width:195px}.topbar-brand span{display:none}.topbar{gap:12px}}@media(max-width:760px){.topbar{height:60px;padding:0 14px}.topbar-brand{flex:0 0 auto;min-width:auto}.topbar-brand img{width:170px;max-height:36px}.topbar-brand span,.breadcrumbs{display:none}.top-actions{margin-left:auto}.search-box{width:150px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand"><img src="assets/ilabpharma-logo.svg" alt="iLabPharma"><span>Process Experience</span></div>
        <div class="breadcrumbs"><span>iLabPharma</span><b>›</b><span id="crumb-module">iLabPharma</span><b>›</b><strong id="crumb-process">Visão geral</strong></div>
        <div class="top-actions"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar processo, etapa..." aria-label="Buscar processo, etapa"></label><button class="icon-btn" title="Alternar tema" id="themeBtn">☼</button><button class="icon-btn" title="Notificações">♧</button><div class="avatar">AN</div></div>
      </header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Fechar">×</button><div id="modalBody"></div></article></div>
  <script src="app.js?v=0.9.0"></script><script src="home.js?v=0.9.0"></script><script src="journey.js?v=0.9.0"></script>
</body>
</html>
