="14" fill="#102f68">Instrumentos / Utensílios</text><circle cx="108" cy="689" r="4" fill="#7042c0"/><text x="121" y="694" font-family="Arial" font-size="14" fill="#102f68">Pontos de Água / Utilidades</text><rect x="22" y="724" width="284" height="137" rx="12" fill="#fff" stroke="#c8d8e8"/><rect x="98" y="732" width="194" height="30" rx="7" fill="#f0a000"/><text x="110" y="753" font-family="Arial" font-size="15" font-weight="800" fill="#fff">Tabelas e Parâmetros</text><circle cx="108" cy="779" r="4" fill="#f0a000"/><text x="121" y="784" font-family="Arial" font-size="14" fill="#102f68">Grau de Contaminação</text><circle cx="108" cy="799" r="4" fill="#f0a000"/><text x="121" y="804" font-family="Arial" font-size="14" fill="#102f68">Configurações de Notificação</text><circle cx="108" cy="819" r="4" fill="#f0a000"/><text x="121" y="824" font-family="Arial" font-size="14" fill="#102f68">Microservices</text><circle cx="108" cy="839" r="4" fill="#f0a000"/><text x="121" y="844" font-family="Arial" font-size="14" fill="#102f68">Notificações do Sistema</text><rect x="376" y="214" width="478" height="58" rx="14" fill="url(#c)"/><text x="615" y="250" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#fff">1. Cadastro e Parametrização</text><rect x="382" y="280" width="466" height="240" rx="28" fill="#071d43" stroke="#147be5" stroke-width="4"/><circle cx="615" cy="366" r="48" fill="#19a7ff" opacity=".8"/><rect x="490" y="405" width="250" height="64" rx="16" fill="#082c61" stroke="#0b86ff"/><text x="615" y="444" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">Módulo Principal</text><text x="615" y="490" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Central de Governança</text><rect x="382" y="532" width="466" height="120" rx="20" fill="#f4faff" stroke="#b8cadc"/><text x="615" y="567" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#102f68">2. Validação e Controle</text><text x="615" y="603" text-anchor="middle" font-family="Arial" font-size="16" fill="#102f68">Regras de negócio   •   Permissões e perfis   •   Audit Trail</text><rect x="382" y="664" width="466" height="126" rx="20" fill="#edf7ff" stroke="#b8cadc"/><text x="615" y="701" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#102f68">3. Disponibilização de Dados Mestres</text><text x="615" y="744" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#102f68">Dados disponíveis para os módulos</text><rect x="876" y="214" width="360" height="666" rx="18" fill="#fbfdff" stroke="#183f73" stroke-width="3"/><rect x="876" y="214" width="360" height="45" rx="18" fill="#082d68"/><text x="1056" y="244" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#fff">Como os módulos utilizam os cadastros?</text><circle cx="914" cy="300" r="22" fill="#1859a6"/><text x="950" y="296" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Produção</text><text x="950" y="317" font-family="Arial" font-size="13.5" fill="#102f68">Ambientes, equipamentos, instrumentos, OPE, usuários, centros de custo.</text><line x1="900" y1="338" x2="1215" y2="338" stroke="#d5dfeb"/><circle cx="914" cy="396" r="22" fill="#1859a6"/><text x="950" y="392" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Estoque</text><text x="950" y="413" font-family="Arial" font-size="13.5" fill="#102f68">Locais físicos, fornecedores, pessoas jurídicas, itens, centros de custo.</text><line x1="900" y1="434" x2="1215" y2="434" stroke="#d5dfeb"/><circle cx="914" cy="492" r="22" fill="#1859a6"/><text x="950" y="488" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Controle da Qualidade (CQ)</text><text x="950" y="509" font-family="Arial" font-size="13.5" fill="#102f68">Ambientes, instrumentos, profissionais, setores, usuários.</text><line x1="900" y1="530" x2="1215" y2="530" stroke="#d5dfeb"/><circle cx="914" cy="588" r="22" fill="#1859a6"/><text x="950" y="584" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Garantia da Qualidade (GQ)</text><text x="950" y="605" font-family="Arial" font-size="13.5" fill="#102f68">Profissionais, estrutura organizacional, documentos, treinamentos.</text><line x1="900" y1="626" x2="1215" y2="626" stroke="#d5dfeb"/><circle cx="914" cy="684" r="22" fill="#1859a6"/><text x="950" y="680" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Controle de Documentos</text><text x="950" y="701" font-family="Arial" font-size="13.5" fill="#102f68">Estrutura organizacional, perfis, aprovadores, vigência.</text><line x1="900" y1="722" x2="1215" y2="722" stroke="#d5dfeb"/><circle cx="914" cy="780" r="22" fill="#1859a6"/><text x="950" y="776" font-family="Arial" font-size="17" font-weight="800" fill="#102f68">Rastreabilidade</text><text x="950" y="797" font-family="Arial" font-size="13.5" fill="#102f68">Lotes, produtos, insumos, movimentações e eventos.</text><rect x="1250" y="214" width="278" height="278" rx="18" fill="#f4fff7" stroke="#16a05b" stroke-width="3"/><rect x="1250" y="214" width="278" height="48" rx="18" fill="#10a451"/><text x="1389" y="246" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">Benefícios</text><text x="1270" y="292" font-family="Arial" font-size="16" fill="#102f68">✓ Processos integrados e consistentes</text><text x="1270" y="325" font-family="Arial" font-size="16" fill="#102f68">✓ Redução de retrabalho</text><text x="1270" y="358" font-family="Arial" font-size="16" fill="#102f68">✓ Conformidade com ANVISA / BPF</text><text x="1270" y="391" font-family="Arial" font-size="16" fill="#102f68">✓ Melhor rastreabilidade</text><text x="1270" y="424" font-family="Arial" font-size="16" fill="#102f68">✓ Segurança da informação</text><text x="1270" y="457" font-family="Arial" font-size="16" fill="#102f68">✓ Governança de acessos</text><rect x="1250" y="505" width="278" height="335" rx="18" fill="#fff6f6" stroke="#d51e1e" stroke-width="3"/><rect x="1250" y="505" width="278" height="48" rx="18" fill="#d51e1e"/><text x="1389" y="537" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#fff">Riscos sem os cadastros</text><text x="1270" y="585" font-family="Arial" font-size="15" fill="#102f68">✕ Impossibilidade de executar</text><text x="1270" y="607" font-family="Arial" font-size="15" fill="#102f68">processos dependentes</text><text x="1270" y="640" font-family="Arial" font-size="15" fill="#102f68">✕ Dados inconsistentes</text><text x="1270" y="673" font-family="Arial" font-size="15" fill="#102f68">✕ Falhas na rastreabilidade</text><text x="1270" y="706" font-family="Arial" font-size="15" fill="#102f68">✕ Não conformidades regulatórias</text><text x="1270" y="739" font-family="Arial" font-size="15" fill="#102f68">✕ Atrasos na produção e liberação</text><rect x="330" y="900" width="1198" height="82" rx="16" fill="#082d68"/><text x="365" y="933" font-family="Arial" font-size="19" font-weight="800" fill="#fff">Módulos Dependentes</text><text x="365" y="961" font-family="Arial" font-size="16" fill="#fff">Produção  •  Estoque  •  CQ  •  GQ  •  Documentos  •  Rastreabilidade</text></svg>