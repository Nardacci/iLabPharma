<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#183b68"><text x="768" y="55" text-anchor="middle" font-size="34" font-weight="700">FLUXO – GESTÃO DA QUARENTENA</text><text x="768" y="95" text-anchor="middle" font-size="30" font-weight="700">(iLabPharma)</text><rect x="70" y="30" width="210" height="55" rx="28" fill="#183b68"/><text x="175" y="66" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">INÍCIO</text><path d="M175 85V120" stroke="#183b68" stroke-width="4"/><path d="M168 112l7 10 7-10" fill="#183b68"/><g stroke-width="2"><rect x="90" y="130" width="330" height="110" rx="12" fill="#eef6ff" stroke="#2784d8"/><text x="255" y="165" text-anchor="middle" font-size="18" font-weight="700">1. RECEBIMENTO DO MATERIAL</text><text x="255" y="194" text-anchor="middle" font-size="15">Entrada de NF ou Ordem</text><text x="255" y="216" text-anchor="middle" font-size="15">de Compra no sistema.</text><path d="M255 240v35" stroke="#183b68" stroke-width="4"/><rect x="90" y="280" width="330" height="125" rx="12" fill="#eef6ff" stroke="#2784d8"/><text x="255" y="316" text-anchor="middle" font-size="18" font-weight="700">2. VERIFICAÇÃO DO ITEM</text><text x="255" y="345" text-anchor="middle" font-size="15">Item está configurado</text><text x="255" y="367" text-anchor="middle" font-size="15">para Quarentena na Entrada?</text><text x="255" y="391" text-anchor="middle" font-size="13">(Cadastro do Item › Sessão Controle)</text><path d="M255 405v40" stroke="#183b68" stroke-width="4"/><rect x="95" y="455" width="320" height="115" rx="12" fill="#fff6df" stroke="#f0a000"/><text x="255" y="490" text-anchor="middle" font-size="18" font-weight="700">3. ENTRADA EM QUARENTENA</text><text x="255" y="520" text-anchor="middle" font-size="15">Item é direcionado automaticamente</text><text x="255" y="542" text-anchor="middle" font-size="15">para o Almoxarifado/Local de</text><text x="255" y="564" text-anchor="middle" font-size="15">Quarentena configurado.</text><path d="M255 570v40" stroke="#183b68" stroke-width="4"/><rect x="95" y="620" width="320" height="105" rx="12" fill="#fff6df" stroke="#f0a000"/><text x="255" y="655" text-anchor="middle" font-size="18" font-weight="700">4. AGUARDANDO APROVAÇÃO</text><text x="255" y="684" text-anchor="middle" font-size="15">Item permanece em Quarentena</text><text x="255" y="706" text-anchor="middle" font-size="15">até aprovação/reprovação.</rect><rect x="550" y="350" width="340" height="115" rx="12" fill="#f3edff" stroke="#7454b8"/><text x="720" y="385" text-anchor="middle" font-size="18" font-weight="700">5. APROVAÇÃO PELO CQ</text><text x="720" y="415" text-anchor="middle" font-size="15">Aprovação realizada pelo</text><text x="720" y="437" text-anchor="middle" font-size="15">Controle da Qualidade.</text><path d="M415 675H500V465H550" fill="none" stroke="#183b68" stroke-width="4"/><rect x="960" y="350" width="350" height="115" rx="12" fill="#eff9f0" stroke="#1d9a4c"/><text x="1135" y="385" text-anchor="middle" font-size="18" font-weight="700">6A. LIBERAÇÃO APROVADA</text><text x="1135" y="415" text-anchor="middle" font-size="15">Item é movimentado da Quarentena</text><text x="1135" y="437" text-anchor="middle" font-size="15">para o Almoxarifado/Local definitivo.</text><path d="M890 407h70" stroke="#1d9a4c" stroke-width="4"/><rect x="960" y="520" width="350" height="105" rx="12" fill="#eff9f0" stroke="#1d9a4c"/><text x="1135" y="555" text-anchor="middle" font-size="18" font-weight="700">7A. DISPONÍVEL PARA USO</text><text x="1135" y="585" text-anchor="middle" font-size="15">Item liberado para consumo,</text><text x="1135" y="607" text-anchor="middle" font-size="15">produção ou outras movimentações.</text><path d="M1135 465v55" stroke="#1d9a4c" stroke-width="4"/><rect x="550" y="520" width="340" height="105" rx="12" fill="#fff0f0" stroke="#d63d45"/><text x="720" y="555" text-anchor="middle" font-size="18" font-weight="700">6B. REPROVADO</text><text x="720" y="585" text-anchor="middle" font-size="15">Item é movimentado da Quarentena</text><text x="720" y="607" text-anchor="middle" font-size="15">para o local configurado como Refugo.</text><path d="M720 465v55" stroke="#d63d45" stroke-width="4"/><rect x="550" y="680" width="340" height="105" rx="12" fill="#fff0f0" stroke="#d63d45"/><text x="720" y="715" text-anchor="middle" font-size="18" font-weight="700">7B. REFUGO</text><text x="720" y="745" text-anchor="middle" font-size="15">Item identificado como reprovado</text><text x="720" y="767" text-anchor="middle" font-size="15">e separado para descarte ou destino definido.</text><path d="M720 625v55" stroke="#d63d45" stroke-width="4"/><rect x="70" y="805" width="520" height="150" rx="12" fill="#faf8ff" stroke="#7454b8"/><text x="330" y="840" text-anchor="middle" font-size="18" font-weight="700">REGRAS E CONTROLES</text><text x="95" y="875" font-size="14" font-weight="700">Permissões:</text><text x="175" y="875" font-size="14">Visualização e liberação definidas por usuário.</text><text x="95" y="900" font-size="14" font-weight="700">Rastreabilidade:</text><text x="190" y="900" font-size="14">Movimentações registradas no sistema.</text><text x="95" y="925" font-size="14" font-weight="700">Histórico:</text><text x="160" y="925" font-size="14">Consulta do histórico do item.</text></g><text x="1160" y="850" text-anchor="middle" font-size="18" font-weight="700">OBSERVAÇÕES</text><text x="1010" y="885" font-size="14">• O fluxo é o mesmo para Matéria-Prima e Produto Acabado.</text><text x="1010" y="910" font-size="14">• A quarentena é automática quando configurada no cadastro.</text><text x="1010" y="935" font-size="14">• A liberação pode ser feita pelo CQ ou pelo Estoque.</text></svg>